
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout San Gil</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="juego">

        <header>
            <h1>🏞️ BREAKOUT SAN GIL</h1>
            <p>Desafío Sangileño</p>
        </header>

        <div class="informacion">
            <span>Puntos: <strong id="puntos">0</strong></span>
            <span>Vidas: <strong id="vidas">3</strong></span>
        </div>

        <canvas id="canvas" width="800" height="500"></canvas>

        <div class="controles">
            <p>⬅️ ➡️ Usa las flechas del teclado para mover la plataforma</p>
        </div>

        <div id="mensaje" class="mensaje">
            <h2>¡Bienvenido a San Gil!</h2>
            <p>Destruye todos los bloques y consigue la mayor puntuación.</p>
            <button onclick="iniciarJuego()">JUGAR</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
